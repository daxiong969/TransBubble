format_version: "13"
default_step_lib_source: https://github.com/bitrise-io/bitrise-steplib.git
project_type: ios

workflows:
  primary:
    machine:
      type: a1-standard-4
    steps:
      - script@1:
          title: Build Unsigned IPA (XcodeGen + xcodebuild)
          inputs:
            - content: |
                #!/usr/bin/env bash
                set -ex
                brew install xcodegen
                xcodegen generate
                xcodebuild -project TransBubble.xcodeproj \
                  -scheme TransBubble \
                  -configuration Release \
                  -derivedDataPath build/DerivedData \
                  -sdk iphoneos \
                  CODE_SIGNING_ALLOWED=NO \
                  CODE_SIGNING_REQUIRED=NO \
                  build
                APP_PATH=$(find build/DerivedData/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" | head -1)
                echo "App: $APP_PATH"
                mkdir -p build/Payload
                cp -R "$APP_PATH" build/Payload/
                cd build && zip -qry "$BITRISE_DEPLOY_DIR/TransBubble-unsigned.ipa" Payload
      - deploy-to-bitrise-io@2:
          title: Deploy IPA artifact
          is_always_run: true
