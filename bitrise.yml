format_version: "26"
default_step_lib_source: https://github.com/bitrise-io/bitrise-steplib.git
project_type: ios

meta:
  bitrise.io:
    stack: osx-xcode-27.2.x

workflows:
  primary:
    description: Clone repo, generate Xcode project with XcodeGen, build unsigned IPA and deploy as artifact.
    steps:
      - script@1:
          title: Build Unsigned IPA (XcodeGen + xcodebuild)
          inputs:
            - content: |
                #!/usr/bin/env bash
                set -ex
                export HOMEBREW_NO_AUTO_UPDATE=1
                brew install xcodegen || true
                rm -rf "$BITRISE_SOURCE_DIR/repo"
                git clone --depth 1 https://github.com/daxiong969/TransBubble.git "$BITRISE_SOURCE_DIR/repo"
                cd "$BITRISE_SOURCE_DIR/repo/SnapTrans"
                ls -la
                xcodegen generate --spec project.yml
                xcodebuild -project SnapTrans.xcodeproj \
                  -scheme SnapTrans \
                  -configuration Release \
                  -derivedDataPath build/DerivedData \
                  -sdk iphoneos \
                  CODE_SIGNING_ALLOWED=NO \
                  CODE_SIGNING_REQUIRED=NO \
                  build
                APP_PATH=$(find build/DerivedData/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" | head -1)
                echo "App: $APP_PATH"
                mkdir -p build/Payload
                cp -R "$APP_PATH" build/Payload/
                cd build && zip -qry "$BITRISE_DEPLOY_DIR/SnapTrans-unsigned.zip" Payload
                echo "IPA(以zip名义部署)完成: $BITRISE_DEPLOY_DIR/SnapTrans-unsigned.zip"
      - deploy-to-bitrise-io@2:
          title: Deploy IPA artifact
          is_always_run: true
