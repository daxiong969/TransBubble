name: SnapTrans
options:
  bundleIdPrefix: com.daxiong969
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    CODE_SIGN_IDENTITY: ""
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGNING_ALLOWED: "NO"
    TARGETED_DEVICE_FAMILY: "1"
    GENERATE_INFOPLIST_FILE: "NO"
targets:
  SnapTrans:
    type: application
    platform: iOS
    sources:
      - SnapTrans
    info:
      path: SnapTrans/Info.plist
      properties:
        CFBundleDisplayName: 译拍通
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        ITSAppUsesNonExemptEncryption: false
        NSPhotoLibraryAddUsageDescription: 用于将带译文叠加的合成图片保存到您的相册，仅保存在本机。
        UIBackgroundModes: [audio]
schemes:
  SnapTrans:
    build:
      targets:
        SnapTrans: all
