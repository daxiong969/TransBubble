name: TransBubble
options:
  bundleIdPrefix: com.transbubble
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    CODE_SIGN_STYLE: Automatic
    IPHONEOS_DEPLOYMENT_TARGET: "15.0"

targets:
  TransBubble:
    type: application
    platform: iOS
    sources:
      - path: TransBubble
    dependencies:
      - target: TransBubbleExtension
        embed: true
    info:
      path: TransBubble/Info.plist
      properties:
        CFBundleDisplayName: TransBubble 悬浮翻译
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.transbubble.app
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  TransBubbleExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: TransBubbleExtension
    info:
      path: TransBubbleExtension/Info.plist
      properties:
        CFBundleDisplayName: TransBubble Safari 翻译
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.Safari.web-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.transbubble.app.extension
        TARGETED_DEVICE_FAMILY: "1"
        SKIP_INSTALL: true

schemes:
  TransBubble:
    build:
      targets:
        TransBubble: all
    run:
      config: Debug
    archive:
      config: Release
