name: Build IPA
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: |
          cd SnapTrans
          xcodegen generate --spec project.yml
      # ===== 云端 iOS 模拟器自动测试：测试不通过则不出 IPA =====
      - name: Run tests on iOS Simulator
        run: |
          cd SnapTrans
          # 动态选择可用的 iPhone 模拟器
          SIM_NAME=$(xcrun simctl list devices available | grep -oE "iPhone [A-Za-z0-9]+(\-[A-Za-z0-9]+)?" | head -1)
          echo "Using simulator: $SIM_NAME"
          xcodebuild test -project SnapTrans.xcodeproj \
            -scheme SnapTrans \
            -destination "platform=iOS Simulator,name=$SIM_NAME,OS=latest" \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            | xcpretty || true
          # xcpretty 可能不存在，重新跑一次拿真实退出码
          xcodebuild test -project SnapTrans.xcodeproj \
            -scheme SnapTrans \
            -destination "platform=iOS Simulator,name=$SIM_NAME,OS=latest" \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            > test_output.txt 2>&1
          if grep -qE "TEST EXECUTE FAILED|** TEST FAILED|Test Suite 'All tests' failed" test_output.txt; then
            echo "::error::模拟器测试失败"; grep -B2 -A8 "error:" test_output.txt | head -60; exit 1
          fi
          if ! grep -qE "Test Suite 'All tests' passed|TEST EXECUTE SUCCEEDED" test_output.txt; then
            echo "::error::未检测到测试通过标记"; tail -40 test_output.txt; exit 1
          fi
          echo "===== 全部测试通过 ====="
      # ===== 测试通过后再编译真机 IPA =====
      - name: Build unsigned IPA
        run: |
          cd SnapTrans
          xcodebuild -project SnapTrans.xcodeproj \
            -scheme SnapTrans \
            -configuration Release \
            -derivedDataPath build/DerivedData \
            -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build
          APP_PATH=$(find build/DerivedData/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" | head -1)
          echo "App: $APP_PATH"
          mkdir -p build/Payload
          cp -R "$APP_PATH" build/Payload/
          cd build && zip -qry SnapTrans-unsigned.zip Payload
      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: SnapTrans-unsigned
          path: SnapTrans/build/SnapTrans-unsigned.zip
