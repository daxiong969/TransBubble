name: Build IPA
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project and build
        run: |
          cd SnapTrans
          xcodegen generate --spec project.yml
          xcodebuild -project SnapTrans.xcodeproj \
            -scheme SnapTrans \
            -configuration Release \
            -derivedDataPath build/DerivedData \
            -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build
          APP_PATH=$(find build/DerivedData/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" | head -1)
          echo "App: $APP_PATH"
          mkdir -p build/Payload
          cp -R "$APP_PATH" build/Payload/
          cd build && zip -qry SnapTrans-unsigned.zip Payload
      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: SnapTrans-unsigned
          path: SnapTrans/build/SnapTrans-unsigned.zip
